<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080A"><title>JOSPAT · Моё пространство</title>
  <link rel="stylesheet" href="style.css?v=notes-1"><link rel="stylesheet" href="theme.css?v=planet-rotate3d"><link rel="stylesheet" href="workspace.css?v=linked-habits"><script defer src="hub.js?v=focus-room"></script><script defer src="journal.js?v=goals-journal"></script><script defer src="mind.js?v=linked-habits"></script><script defer src="goals.js?v=linked-habits"></script><script defer src="today.js?v=focus-room"></script><script defer src="habits.js?v=linked-habits"></script><script defer src="planner.js?v=focus-room"></script><script defer src="space.js?v=arrival-ramp"></script><script defer src="backup.js?v=linked-habits"></script><script defer src="planet.js?v=arrival-ramp"></script><script defer src="interactions.js?v=notes-1"></script><script defer src="note-files.js?v=notes-1"></script><script defer src="notes.js?v=notes-1"></script><script defer src="focus-audio.js?v=focus-scenes"></script><script defer src="focus.js?v=focus-scenes"></script><script defer src="constellation.js?v=focus-scenes"></script><script defer src="avoidance.js?v=linked-habits"></script><script defer src="app.js?v=linked-habits"></script>
</head>
<body>
  <div class="site-nav">
    <a class="brand" href="#home" aria-label="JOSPAT — все разделы">jospat<span>.</span></a>
    <nav class="site-links" aria-label="Навигация"><a href="#tasks">Задачи</a><a href="#calendar">Календарь</a><a href="#goals">Цели</a><a href="#sections">Все разделы</a><a class="site-focus" href="#focus">Фокус</a></nav>
    <div class="identity"><span class="avatar">А</span><span>Алинур</span><button type="button" id="open-backup" title="Резервная копия" aria-label="Резервная копия"><span aria-hidden="true">↓</span> Копия</button></div>
  </div>
  <nav class="mobile-nav" aria-label="Основные разделы">
    <a href="#home"><span aria-hidden="true">⌂</span>Сегодня</a>
    <a href="#habits"><span aria-hidden="true">◉</span>Привычки</a>
    <a href="#tasks"><span aria-hidden="true">✓</span>Задачи</a>
    <a href="#calendar"><span aria-hidden="true">▦</span>Календарь</a>
    <a href="#sections"><span aria-hidden="true">⋯</span>Разделы</a>
  </nav>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <main>
    <div class="topline"><a id="back" href="#home">← Сегодня</a><time id="today"></time></div>
    <header><div><h1 id="title"></h1></div><button id="primary" class="primary"></button></header>
    <section class="toolbar"><h2 id="period"></h2><div class="controls"><button id="prev" aria-label="Предыдущий период">‹</button><button id="current">Сегодня</button><button id="next" aria-label="Следующий период">›</button></div></section>
    <section id="view" tabindex="-1"></section>
    <p id="status" role="status"></p>
  </main>
  <dialog id="editor"><form method="dialog" id="entry">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Закрыть">×</button></div>
    <p id="habit-goal-context" class="dialog-summary" hidden></p>
    <div id="template-fields"><label for="template">Начать с шаблона</label><select id="template"></select></div>
    <label for="name">Название</label><input id="name" required maxlength="90" autocomplete="off">
    <div id="habit-fields" hidden>
      <label for="habit-description">Описание</label><textarea id="habit-description" rows="3" maxlength="240" placeholder="Например, сколько времени выделить"></textarea>
      <fieldset><legend>Цвет</legend><div id="habit-palette" class="habit-palette"></div><label class="habit-custom-color">Свой цвет <input id="habit-color" type="color"></label></fieldset>
    </div>
    <div id="schedule-fields"><fieldset><legend>Дни недели</legend><div id="schedule"></div></fieldset></div>
    <div id="task-fields"><label for="date">Дата</label><input type="date" id="date" min="1000-01-01" max="9999-12-31"><div id="event-time-fields"><label for="event-time">Время</label><input type="time" id="event-time" value="09:00"></div></div>
    <div id="planner-fields" hidden>
      <label for="task-project">Проект <span class="muted">(необязательно)</span></label><input id="task-project" maxlength="60" placeholder="Например, учёба">
      <label for="task-time">Время <span class="muted">(необязательно)</span></label><input id="task-time" type="time">
      <label for="task-priority">Приоритет</label><select id="task-priority"><option value="0">Обычный</option><option value="1">Важный</option><option value="2">Срочный</option></select>
    </div>
    <button type="submit" class="primary">Сохранить</button>
    <button type="button" id="habit-pause" hidden>Пауза на сегодня</button>
    <button type="button" id="habit-delete" class="danger-action" hidden>Удалить привычку</button>
  </form></dialog>
  <dialog id="close-day" aria-labelledby="close-day-title"><form id="close-day-form">
    <div class="dialog-head"><h2 id="close-day-title">Итог дня</h2><button type="button" id="close-day-cancel" aria-label="Закрыть итог дня">×</button></div>
    <p id="close-day-summary" class="dialog-summary"></p>
    <label for="close-day-win">Что сегодня получилось?</label>
    <textarea id="close-day-win" rows="3" maxlength="600" placeholder="Запиши одну победу дня"></textarea>
    <label for="close-day-task">Первый шаг на завтра</label>
    <select id="close-day-task"></select>
    <label id="close-day-new-task" hidden>Название шага<input id="close-day-task-name" maxlength="90"></label>
    <p id="close-day-error" role="status"></p>
    <button type="submit" class="primary">Сохранить итог</button>
  </form></dialog>
  <dialog id="backup" aria-labelledby="backup-title">
    <div class="dialog-head"><h2 id="backup-title">Резервная копия</h2><button type="button" id="backup-close" aria-label="Закрыть резервное копирование">×</button></div>
    <p class="dialog-summary">Сохрани все записи в один файл или восстанови их на другом устройстве.</p>
    <button type="button" id="backup-export">Скачать копию</button>
    <label class="backup-file" for="backup-file">Файл для восстановления</label>
    <input type="file" id="backup-file" accept=".json,application/json">
    <p id="backup-status" role="status"></p>
    <button type="button" id="backup-restore" class="primary" hidden>Заменить данные этой копией</button>
  </dialog>
  <button type="button" id="focus-badge" class="focus-badge" hidden></button>
  <div id="workspace-feedback" class="workspace-feedback" role="status" aria-live="polite"></div>
</body></html>
