<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10120f"><title>JOSPAT · Core</title>
  <link rel="stylesheet" href="style.css"><script defer src="app.js"></script>
</head>
<body>
  <aside>
    <a class="brand" href="#habits">JOSPAT<span>.</span></a>
    <nav aria-label="Разделы платформы">
      <a class="module selected" href="#habits"><i>◈</i> Core</a>
      <div class="children">
        <a href="#habits">Трекер привычек</a><a href="#weekly">План недели</a><a href="#calendar">Календарь</a>
      </div>
      <div class="later" aria-label="Будущие разделы">
        <span><i>ϟ</i> Streak</span><span><i>▥</i> Analytics</span>
        <span><i>◔</i> Progress</span><span><i>◎</i> Goals</span>
        <span><i>▤</i> Notes</span><span><i>⊞</i> Доп. системы</span><span><i>✧</i> Future Self</span>
      </div>
    </nav>
    <div class="account"><b>A</b><div>Алинур<small>Личное пространство</small></div></div>
  </aside>
  <main>
    <div class="topline"><span>Рабочее пространство <em>/</em> <strong>Core</strong></span><time id="today"></time></div>
    <header><div><p class="kicker">JOSPAT CORE</p><h1 id="title"></h1></div><button id="primary" class="primary"></button></header>
    <div class="tabs" aria-label="Экраны Core"><a href="#habits">Трекер</a><a href="#weekly">План недели</a><a href="#calendar">Календарь</a></div>
    <section class="toolbar"><h2 id="period"></h2><div class="controls"><button id="prev" aria-label="Предыдущий период">‹</button><button id="current">Сегодня</button><button id="next" aria-label="Следующий период">›</button></div></section>
    <section id="view"></section>
    <p id="status" role="status"></p>
  </main>
  <dialog id="editor"><form method="dialog" id="entry">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" id="close" aria-label="Закрыть">×</button></div>
    <div id="template-fields"><label for="template">Начать с шаблона</label><select id="template"></select></div>
    <label for="name">Название</label><input id="name" required maxlength="90" autocomplete="off">
    <div id="schedule-fields"><fieldset><legend>Дни недели</legend><div id="schedule"></div></fieldset></div>
    <div id="task-fields"><label for="date">Дата</label><input type="date" id="date" min="1000-01-01" max="9999-12-31"></div>
    <button type="submit" class="primary">Сохранить</button>
  </form></dialog>
</body></html>
